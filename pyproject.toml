[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv", ".venv-intel-backup", "input", "output", "cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["main.py", "web_app.py", "helpers", "tests"]
exclude = "(^|/)([.]venv|[.]venv-intel-backup|input|output|cache)/"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["helpers", "main", "web_app"]
branch = true
omit = ["tests/*", ".venv/*", ".venv-intel-backup/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
