<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700"
  viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">Track processing</title>
  <desc id="desc">A durable job moves through analysis, optional edit creation, export, and publication. Calls are numbered in execution order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1680a6"/>
    </marker>
    <style>
      .title { font: 750 30px system-ui, -apple-system, sans-serif; fill: #18323c; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #60747c; }
      .order-note {
        font: 650 12px system-ui, -apple-system, sans-serif;
        fill: #1680a6;
        letter-spacing: .7px;
      }
      .call-number { font: 700 14px system-ui, -apple-system, sans-serif; fill: #1680a6; }
      .owner { font: 700 11px system-ui, -apple-system, sans-serif; fill: #ffffff; letter-spacing: .25px; }
      .call-title { font: 720 17px system-ui, -apple-system, sans-serif; fill: #18323c; }
      .symbol { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #60747c; }
      .arrow {
        fill: none;
        stroke: #1680a6;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .alternate-title {
        font: 750 12px system-ui, -apple-system, sans-serif;
        fill: #60747c;
        letter-spacing: 1.3px;
      }
      .alternate-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #18323c; }
    </style>
  </defs>
  <rect width="1440" height="700" fill="#ffffff"/>
  <rect x="28" y="25" width="1384" height="510" rx="24" fill="#f4f8fa"/>
  <text class="title" x="52" y="67">Track processing</text>
  <text class="subtitle" x="52" y="95">A durable job moves through analysis, optional edit creation, export, and publication.</text>
  <text class="order-note" x="52" y="132">PRIMARY CALL ORDER</text>
  <path class="arrow" d="M 352 246.0 H 378" marker-end="url(#arrow)"/><path class="arrow" d="M 686 246.0 H 712" marker-end="url(#arrow)"/><path class="arrow" d="M 1020 246.0 H 1046" marker-end="url(#arrow)"/><path class="arrow" d="M 1354 246.0 H 1371.0 V 443.0 H 1362" marker-end="url(#arrow)"/><path class="arrow" d="M 1054 443.0 H 1028" marker-end="url(#arrow)"/><path class="arrow" d="M 720 443.0 H 694" marker-end="url(#arrow)"/><path class="arrow" d="M 386 443.0 H 360" marker-end="url(#arrow)"/>
  <g class="call" id="call-1">
  <text class="call-number" x="52.0" y="172.0">(1)</text>
  <rect x="52" y="185" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="67" y="199" width="96" height="25" rx="12.5"
    fill="#147f9f"/>
  <text class="owner" x="80" y="216">Process UI</text>
  <text class="call-title" text-anchor="middle"><tspan x="202.0" y="239.0">Submit processing command</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="202.0" y="276.0">POST /api/jobs</tspan></text>
</g><g class="call" id="call-2">
  <text class="call-number" x="386.0" y="172.0">(2)</text>
  <rect x="386" y="185" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="401" y="199" width="82" height="25" rx="12.5"
    fill="#4b6cb7"/>
  <text class="owner" x="414" y="216">Workflow</text>
  <text class="call-title" text-anchor="middle"><tspan x="536.0" y="239.0">Validate and persist job</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="536.0" y="276.0">JobWorkflowService.create</tspan></text>
</g><g class="call" id="call-3">
  <text class="call-number" x="720.0" y="172.0">(3)</text>
  <rect x="720" y="185" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="735" y="199" width="61" height="25" rx="12.5"
    fill="#258b72"/>
  <text class="owner" x="748" y="216">Queue</text>
  <text class="call-title" text-anchor="middle"><tspan x="870.0" y="239.0">Schedule worker</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="870.0" y="276.0">WebJobService.enqueue_many</tspan></text>
</g><g class="call" id="call-4">
  <text class="call-number" x="1054.0" y="172.0">(4)</text>
  <rect x="1054" y="185" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="1069" y="199" width="82" height="25" rx="12.5"
    fill="#258b72"/>
  <text class="owner" x="1082" y="216">Analysis</text>
  <text class="call-title" text-anchor="middle"><tspan x="1204.0" y="239.0">Load and analyze</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="1204.0" y="276.0">AnalysisPreparationService.prepare</tspan></text>
</g><g class="call" id="call-5">
  <text class="call-number" x="1054.0" y="369.0">(5)</text>
  <rect x="1054" y="382" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="1069" y="396" width="89" height="25" rx="12.5"
    fill="#258b72"/>
  <text class="owner" x="1082" y="413">Selection</text>
  <text class="call-title" text-anchor="middle"><tspan x="1204.0" y="436.0">Select edit candidates</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="1204.0" y="473.0">CandidateSelectionOrchestrator</tspan></text>
</g><g class="call" id="call-6">
  <text class="call-number" x="720.0" y="369.0">(6)</text>
  <rect x="720" y="382" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="735" y="396" width="61" height="25" rx="12.5"
    fill="#258b72"/>
  <text class="owner" x="748" y="413">Audio</text>
  <text class="call-title" text-anchor="middle"><tspan x="870.0" y="436.0">Render and export</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="870.0" y="473.0">RenderExportTransaction</tspan></text>
</g><g class="call" id="call-7">
  <text class="call-number" x="386.0" y="369.0">(7)</text>
  <rect x="386" y="382" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="401" y="396" width="131" height="25" rx="12.5"
    fill="#705aa8"/>
  <text class="owner" x="414" y="413">Queue + catalog</text>
  <text class="call-title" text-anchor="middle"><tspan x="536.0" y="436.0">Publish result</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="536.0" y="473.0">FileResult + projections</tspan></text>
</g><g class="call" id="call-8">
  <text class="call-number" x="52.0" y="369.0">(8)</text>
  <rect x="52" y="382" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="67" y="396" width="96" height="25" rx="12.5"
    fill="#147f9f"/>
  <text class="owner" x="80" y="413">Process UI</text>
  <text class="call-title" text-anchor="middle"><tspan x="202.0" y="436.0">Show queue state</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="202.0" y="473.0">poll active / attention / history</tspan></text>
</g>
  <text class="alternate-title" x="52" y="565">ALTERNATE PATHS</text><g class="alternate"><rect x="52" y="583" width="655" height="72" rx="14" fill="#fff8f7" stroke="#eed1cf"/><circle cx="77" cy="619" r="8" fill="#c95955"/><text class="alternate-text"><tspan x="100" y="613">Analysis-only job → skip candidate selection and rendering, then publish</tspan><tspan x="100" y="631">analysis.</tspan></text></g><g class="alternate"><rect x="733" y="583" width="655" height="72" rx="14" fill="#fff8f7" stroke="#eed1cf"/><circle cx="758" cy="619" r="8" fill="#c95955"/><text class="alternate-text"><tspan x="781" y="613">Stage failure → run exactly-once cleanup and persist a failed receipt.</tspan></text></g>
</svg>
