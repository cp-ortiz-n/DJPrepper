<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1633"
  viewBox="0 0 1600 1633" role="img" aria-labelledby="title desc">
  <title id="title">Music Files and catalog</title>
  <desc id="desc">Catalog reads and mutations remain fast while projection publication keeps every consumer current.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167ba3"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85852"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #52666e; }
      .lane-label {
        font: 700 14px system-ui, -apple-system, sans-serif;
        letter-spacing: 1.3px;
        fill: #52666e;
        text-transform: uppercase;
      }
      .node-label { font: 700 15px system-ui, -apple-system, sans-serif; }
      .edge-label {
        font: 700 11px system-ui, -apple-system, sans-serif;
        fill: #132f3a;
        letter-spacing: .4px;
      }
      .details-title { font: 700 19px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .step-number { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .step-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #132f3a; }
    </style>
  </defs>
  <rect width="1600" height="1633" fill="#ffffff"/>
  <text class="title" x="35" y="43">Music Files and catalog</text>
  <text class="subtitle" x="35" y="72">Catalog reads and mutations remain fast while projection publication keeps every consumer current.</text>
  <line x1="35" y1="94" x2="1565" y2="94" stroke="#e8f0f3"/>
  <rect x="35.0" y="135" width="340" height="912" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="405.0" y="135" width="340" height="912" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="775.0" y="135" width="340" height="912" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="1145.0" y="135" width="340" height="912" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/>
  <text class="lane-label" x="205" y="122" text-anchor="middle">User &amp; browser</text><text class="lane-label" x="575" y="122" text-anchor="middle">HTTP boundary</text><text class="lane-label" x="945" y="122" text-anchor="middle">Services &amp; policy</text><text class="lane-label" x="1315" y="122" text-anchor="middle">Durable state</text>
  <g><path d="M 344.0 178.0 H 390.0 V 178.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 714.0 178.0 H 945.0 V 290.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 290.0 H 744.5 V 514.0 H 313.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="692.5" y="382.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="744.5" y="398.0" text-anchor="middle">render results</text></g><g><path d="M 205.0 566.0 H 235.0 V 927.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="153.0" y="726.5" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="205.0" y="742.5" text-anchor="middle">NO</text></g><g><path d="M 313.0 514.0 H 374.5 V 514.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="322.5" y="494.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="374.5" y="510.0" text-anchor="middle">YES</text></g><g><path d="M 714.0 514.0 H 760.0 V 514.0 H 806.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 945.0 549.0 H 975.0 V 686.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1053.0 738.0 H 1114.5 V 738.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1062.5" y="718.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="1114.5" y="734.0" text-anchor="middle">YES</text></g><g><path d="M 837.0 738.0 H 775.5 V 738.0 H 714.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="723.5" y="718.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="775.5" y="734.0" text-anchor="middle">NO</text></g><g><path d="M 1315.0 773.0 H 1345.0 V 927.0 H 1315.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 962.0 H 760.0 V 962.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 436.0 738.0 H 390.0 V 962.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="338.0" y="830.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="390.0" y="846.0" text-anchor="middle">unchanged state</text></g>
  <g id="browse"><title>Search, filter, or select tracks</title><rect x="66.0" y="143.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="169.0">Search, filter, or select</tspan><tspan x="205.0" y="190.0">tracks</tspan></text></g><g id="catalog"><title>GET downloaded library page</title><rect x="436.0" y="143.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="179.0">GET downloaded library page</tspan></text></g><g id="projection"><title>Read paginated catalog projection</title><rect x="1176.0" y="255.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="281.0">Read paginated catalog</tspan><tspan x="1315.0" y="302.0">projection</tspan></text></g><g id="mutate"><title>Edit, delete, retag, or repair?</title><polygon points="205,456 321,514 205,572 89,514" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="505.0">Edit, delete, retag, or</tspan><tspan x="205.0" y="526.0">repair?</tspan></text></g><g id="route"><title>Send validated mutation</title><rect x="436.0" y="479.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="515.0">Send validated mutation</tspan></text></g><g id="service"><title>Metadata / batch service</title><rect x="806.0" y="479.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="515.0">Metadata / batch service</tspan></text></g><g id="safe"><title>Mutation safe and consistent?</title><polygon points="945,680 1061,738 945,796 829,738" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="729.0">Mutation safe and</tspan><tspan x="945.0" y="750.0">consistent?</tspan></text></g><g id="files"><title>Synchronize WAV and sidecars</title><rect x="1176.0" y="703.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="739.0">Synchronize WAV and sidecars</tspan></text></g><g id="publish"><title>Invalidate and rebuild projections</title><rect x="1176.0" y="927.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="953.0">Invalidate and rebuild</tspan><tspan x="1315.0" y="974.0">projections</tspan></text></g><g id="refresh"><title>Refresh page with receipt</title><rect x="66.0" y="927.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="963.0">Refresh page with receipt</tspan></text></g><g id="refuse"><title>Refuse and explain conflict</title><rect x="436.0" y="703.0" width="278" height="70" rx="8" fill="#d85852" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="739.0">Refuse and explain conflict</tspan></text></g>
  <line x1="35" y1="1097" x2="1565" y2="1097" stroke="#e8f0f3"/><text class="details-title" x="35" y="1127">Detailed implementation steps</text><g class="step"><rect x="35" y="1142" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1173" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1178" text-anchor="middle">1</text><text class="step-text"><tspan x="92" y="1159">createRequestStateController() restores filters, debounces input, cancels old</tspan><tspan x="92" y="1177">requests, and tracks generations.</tspan></text></g><g class="step"><rect x="815" y="1142" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1173" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1178" text-anchor="middle">2</text><text class="step-text"><tspan x="872" y="1159">GET /api/downloaded-library asks DownloadedCatalogQueryService for one page plus</tspan><tspan x="872" y="1177">current facets.</tspan></text></g><g class="step"><rect x="35" y="1218" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1249" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1254" text-anchor="middle">3</text><text class="step-text"><tspan x="92" y="1235">The catalog projection returns stable track IDs, paths, analysis state, artwork,</tspan><tspan x="92" y="1253">quality, genres, and playlists.</tspan></text></g><g class="step"><rect x="815" y="1218" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1249" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1254" text-anchor="middle">4</text><text class="step-text"><tspan x="872" y="1235">The view rejects superseded responses, renders filter chips, and preserves</tspan><tspan x="872" y="1253">selection across safe refreshes.</tspan></text></g><g class="step"><rect x="35" y="1294" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1325" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1330" text-anchor="middle">5</text><text class="step-text"><tspan x="92" y="1311">Delivery routes stream audio, artwork, downloads, Finder reveal results, or</tspan><tspan x="92" y="1329">selected-track ZIP archives.</tspan></text></g><g class="step"><rect x="815" y="1294" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1325" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1330" text-anchor="middle">6</text><text class="step-text"><tspan x="872" y="1311">Analysis routes enqueue selected or filter-matched tracks through</tspan><tspan x="872" y="1329">DownloadedTrackAnalysisQueue.</tspan></text></g><g class="step"><rect x="35" y="1370" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1401" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1406" text-anchor="middle">7</text><text class="step-text"><tspan x="92" y="1387">Mutation routes validate delete, genre, metadata, repair, and retag commands</tspan><tspan x="92" y="1405">before touching files.</tspan></text></g><g class="step"><rect x="815" y="1370" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1401" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1406" text-anchor="middle">8</text><text class="step-text"><tspan x="872" y="1387">TrackMetadataMutationService applies one authoritative metadata rule set to</tspan><tspan x="872" y="1405">SQLite, WAV tags, and sidecars.</tspan></text></g><g class="step"><rect x="35" y="1446" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1477" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1482" text-anchor="middle">9</text><text class="step-text"><tspan x="92" y="1463">MetadataBatchService and BatchOperationRegistry expose resumable progress for bulk</tspan><tspan x="92" y="1481">maintenance.</tspan></text></g><g class="step"><rect x="815" y="1446" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1477" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1482" text-anchor="middle">10</text><text class="step-text"><tspan x="872" y="1463">RecordingFamilyService manages duplicate candidates, merge, keep-separate, link,</tspan><tspan x="872" y="1481">and unlink decisions.</tspan></text></g><g class="step"><rect x="35" y="1522" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1553" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1558" text-anchor="middle">11</text><text class="step-text"><tspan x="92" y="1539">LibraryMaintenanceService reconciles catalog/filesystem drift and refuses unsafe</tspan><tspan x="92" y="1557">automatic repair.</tspan></text></g><g class="step"><rect x="815" y="1522" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1553" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1558" text-anchor="middle">12</text><text class="step-text"><tspan x="872" y="1539">Every successful mutation invalidates caches, republishes projections, and returns</tspan><tspan x="872" y="1557">a visible operation receipt.</tspan></text></g>
</svg>
