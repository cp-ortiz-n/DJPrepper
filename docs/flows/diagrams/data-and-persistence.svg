<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1857"
  viewBox="0 0 1600 1857" role="img" aria-labelledby="title desc">
  <title id="title">Data and persistence propagation</title>
  <desc id="desc">A mutation is committed once, synchronized to managed files, and republished to every consumer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167ba3"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85852"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #52666e; }
      .lane-label {
        font: 700 14px system-ui, -apple-system, sans-serif;
        letter-spacing: 1.3px;
        fill: #52666e;
        text-transform: uppercase;
      }
      .node-label { font: 700 15px system-ui, -apple-system, sans-serif; }
      .edge-label {
        font: 700 11px system-ui, -apple-system, sans-serif;
        fill: #132f3a;
        letter-spacing: .4px;
      }
      .details-title { font: 700 19px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .step-number { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .step-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #132f3a; }
    </style>
  </defs>
  <rect width="1600" height="1857" fill="#ffffff"/>
  <text class="title" x="35" y="43">Data and persistence propagation</text>
  <text class="subtitle" x="35" y="72">A mutation is committed once, synchronized to managed files, and republished to every consumer.</text>
  <line x1="35" y1="94" x2="1565" y2="94" stroke="#e8f0f3"/>
  <rect x="35.0" y="135" width="340" height="1136" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="405.0" y="135" width="340" height="1136" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="775.0" y="135" width="340" height="1136" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="1145.0" y="135" width="340" height="1136" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/>
  <text class="lane-label" x="205" y="122" text-anchor="middle">User &amp; browser</text><text class="lane-label" x="575" y="122" text-anchor="middle">HTTP boundary</text><text class="lane-label" x="945" y="122" text-anchor="middle">Services &amp; policy</text><text class="lane-label" x="1315" y="122" text-anchor="middle">Durable state</text>
  <g><path d="M 344.0 178.0 H 390.0 V 178.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 714.0 178.0 H 760.0 V 290.0 H 806.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 945.0 325.0 H 975.0 V 462.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1053.0 514.0 H 1114.5 V 514.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1062.5" y="494.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="1114.5" y="510.0" text-anchor="middle">YES</text></g><g><path d="M 837.0 514.0 H 775.5 V 514.0 H 714.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="723.5" y="494.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="775.5" y="510.0" text-anchor="middle">NO</text></g><g><path d="M 1315.0 549.0 H 1345.0 V 703.0 H 1315.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 738.0 H 1130.0 V 850.0 H 1084.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1084.0 850.0 H 1130.0 V 962.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1084.0 850.0 H 1130.0 V 1186.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 962.0 H 760.0 V 1186.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 1186.0 H 760.0 V 1186.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 575.0 549.0 H 390.0 V 1151.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="338.0" y="830.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="390.0" y="846.0" text-anchor="middle">error receipt</text></g>
  <g id="change"><title>Import, analysis, or correction</title><rect x="66.0" y="143.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="169.0">Import, analysis, or</tspan><tspan x="205.0" y="190.0">correction</tspan></text></g><g id="command"><title>Validated feature command</title><rect x="436.0" y="143.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="179.0">Validated feature command</tspan></text></g><g id="service"><title>Owning mutation service</title><rect x="806.0" y="255.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="291.0">Owning mutation service</tspan></text></g><g id="atomic"><title>Atomic durable update succeeds?</title><polygon points="945,456 1061,514 945,572 829,514" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="505.0">Atomic durable update</tspan><tspan x="945.0" y="526.0">succeeds?</tspan></text></g><g id="sqlite"><title>SQLite capability</title><rect x="1176.0" y="479.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="515.0">SQLite capability</tspan></text></g><g id="files"><title>Managed WAV / sidecar state</title><rect x="1176.0" y="703.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="739.0">Managed WAV / sidecar state</tspan></text></g><g id="publish"><title>CatalogProjectionPublisher</title><rect x="806.0" y="815.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="851.0">CatalogProjectionPublisher</tspan></text></g><g id="search"><title>DJ Library search projection</title><rect x="1176.0" y="927.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="963.0">DJ Library search projection</tspan></text></g><g id="set"><title>Set Builder catalog JSON</title><rect x="1176.0" y="1151.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="1187.0">Set Builder catalog JSON</tspan></text></g><g id="visible"><title>Consumers load new generation</title><rect x="66.0" y="1151.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="1177.0">Consumers load new</tspan><tspan x="205.0" y="1198.0">generation</tspan></text></g><g id="failure"><title>Rollback and report unchanged state</title><rect x="436.0" y="479.0" width="278" height="70" rx="8" fill="#d85852" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="505.0">Rollback and report</tspan><tspan x="575.0" y="526.0">unchanged state</tspan></text></g>
  <line x1="35" y1="1321" x2="1565" y2="1321" stroke="#e8f0f3"/><text class="details-title" x="35" y="1351">Detailed implementation steps</text><g class="step"><rect x="35" y="1366" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1397" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1402" text-anchor="middle">1</text><text class="step-text"><tspan x="92" y="1383">The route parses an input model and calls a service that depends on the narrowest</tspan><tspan x="92" y="1401">persistence protocol.</tspan></text></g><g class="step"><rect x="815" y="1366" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1397" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1402" text-anchor="middle">2</text><text class="step-text"><tspan x="872" y="1383">JobRepository remains a compatibility facade; SQL implementations stay in focused</tspan><tspan x="872" y="1401">jobs, catalog, and system mixins.</tspan></text></g><g class="step"><rect x="35" y="1442" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1473" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1478" text-anchor="middle">3</text><text class="step-text"><tspan x="92" y="1459">RepositorySchemaInitializer applies ordered, idempotent migrations before normal</tspan><tspan x="92" y="1477">reads or writes begin.</tspan></text></g><g class="step"><rect x="815" y="1442" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1473" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1478" text-anchor="middle">4</text><text class="step-text"><tspan x="872" y="1459">The service performs the SQLite mutation atomically and never lets a route own</tspan><tspan x="872" y="1477">transaction logic.</tspan></text></g><g class="step"><rect x="35" y="1518" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1549" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1554" text-anchor="middle">5</text><text class="step-text"><tspan x="92" y="1535">Approved metadata or path changes synchronize managed WAV tags, sidecars, artwork,</tspan><tspan x="92" y="1553">playlists, and file locations.</tspan></text></g><g class="step"><rect x="815" y="1518" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1549" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1554" text-anchor="middle">6</text><text class="step-text"><tspan x="872" y="1535">CatalogProjectionPublisher invalidates in-memory catalog, facet, artwork, or</tspan><tspan x="872" y="1553">waveform caches as appropriate.</tspan></text></g><g class="step"><rect x="35" y="1594" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1625" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1630" text-anchor="middle">7</text><text class="step-text"><tspan x="92" y="1611">CatalogProjectionBuilder combines durable catalog rows with completed processing</tspan><tspan x="92" y="1629">evidence.</tspan></text></g><g class="step"><rect x="815" y="1594" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1625" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1630" text-anchor="middle">8</text><text class="step-text"><tspan x="872" y="1620">replace_library_search_index() publishes the paginated DJ Library projection.</tspan></text></g><g class="step"><rect x="35" y="1670" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1701" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1706" text-anchor="middle">9</text><text class="step-text"><tspan x="92" y="1687">The bounded set_builder_catalog.json projection publishes planning-safe track</tspan><tspan x="92" y="1705">evidence.</tspan></text></g><g class="step"><rect x="815" y="1670" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1701" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1706" text-anchor="middle">10</text><text class="step-text"><tspan x="872" y="1687">Source signatures avoid unnecessary full rebuilds while guaranteeing changed</tspan><tspan x="872" y="1705">corrections become visible.</tspan></text></g><g class="step"><rect x="35" y="1746" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1777" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1782" text-anchor="middle">11</text><text class="step-text"><tspan x="92" y="1763">Operation receipts state what changed, where it was written, and whether it</tspan><tspan x="92" y="1781">survives application restart.</tspan></text></g>
</svg>
