<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1633"
  viewBox="0 0 1600 1633" role="img" aria-labelledby="title desc">
  <title id="title">Review, feedback, and reporting</title>
  <desc id="desc">Human decisions become durable corrections, preference evidence, and refreshed projections.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167ba3"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85852"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #52666e; }
      .lane-label {
        font: 700 14px system-ui, -apple-system, sans-serif;
        letter-spacing: 1.3px;
        fill: #52666e;
        text-transform: uppercase;
      }
      .node-label { font: 700 15px system-ui, -apple-system, sans-serif; }
      .edge-label {
        font: 700 11px system-ui, -apple-system, sans-serif;
        fill: #132f3a;
        letter-spacing: .4px;
      }
      .details-title { font: 700 19px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .step-number { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .step-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #132f3a; }
    </style>
  </defs>
  <rect width="1600" height="1633" fill="#ffffff"/>
  <text class="title" x="35" y="43">Review, feedback, and reporting</text>
  <text class="subtitle" x="35" y="72">Human decisions become durable corrections, preference evidence, and refreshed projections.</text>
  <line x1="35" y1="94" x2="1565" y2="94" stroke="#e8f0f3"/>
  <rect x="35.0" y="135" width="340" height="912" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="405.0" y="135" width="340" height="912" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="775.0" y="135" width="340" height="912" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="1145.0" y="135" width="340" height="912" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/>
  <text class="lane-label" x="205" y="122" text-anchor="middle">User &amp; browser</text><text class="lane-label" x="575" y="122" text-anchor="middle">HTTP boundary</text><text class="lane-label" x="945" y="122" text-anchor="middle">Services &amp; policy</text><text class="lane-label" x="1315" y="122" text-anchor="middle">Durable state</text>
  <g><path d="M 205.0 213.0 H 235.0 V 350.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 313.0 402.0 H 374.5 V 402.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="322.5" y="382.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="374.5" y="398.0" text-anchor="middle">chosen action</text></g><g><path d="M 714.0 402.0 H 775.5 V 402.0 H 837.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1053.0 402.0 H 1114.5 V 626.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1062.5" y="494.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="1114.5" y="510.0" text-anchor="middle">VALID</text></g><g><path d="M 837.0 402.0 H 775.5 V 626.0 H 714.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="723.5" y="494.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="775.5" y="510.0" text-anchor="middle">INVALID</text></g><g><path d="M 1176.0 626.0 H 1130.0 V 738.0 H 1084.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1084.0 738.0 H 1130.0 V 962.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 962.0 H 760.0 V 962.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 436.0 626.0 H 390.0 V 962.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="338.0" y="774.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="390.0" y="790.0" text-anchor="middle">not saved</text></g>
  <g id="review"><title>Review candidate, track, or set</title><rect x="66.0" y="143.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="169.0">Review candidate, track, or</tspan><tspan x="205.0" y="190.0">set</tspan></text></g><g id="decision"><title>Keep, reject, rate, or correct?</title><polygon points="205,344 321,402 205,460 89,402" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="393.0">Keep, reject, rate, or</tspan><tspan x="205.0" y="414.0">correct?</tspan></text></g><g id="submit"><title>Submit feedback command</title><rect x="436.0" y="367.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="403.0">Submit feedback command</tspan></text></g><g id="validate"><title>Validate identity and reason</title><polygon points="945,344 1061,402 945,460 829,402" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="403.0">Validate identity and reason</tspan></text></g><g id="persist"><title>Persist feedback / verification</title><rect x="1176.0" y="591.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="617.0">Persist feedback /</tspan><tspan x="1315.0" y="638.0">verification</tspan></text></g><g id="preference"><title>Update learned preference evidence</title><rect x="806.0" y="703.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="729.0">Update learned preference</tspan><tspan x="945.0" y="750.0">evidence</tspan></text></g><g id="projection"><title>Refresh reports and projections</title><rect x="1176.0" y="927.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="953.0">Refresh reports and</tspan><tspan x="1315.0" y="974.0">projections</tspan></text></g><g id="receipt"><title>Show saved state and next action</title><rect x="66.0" y="927.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="953.0">Show saved state and next</tspan><tspan x="205.0" y="974.0">action</tspan></text></g><g id="reject"><title>Preserve state; explain rejection</title><rect x="436.0" y="591.0" width="278" height="70" rx="8" fill="#d85852" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="617.0">Preserve state; explain</tspan><tspan x="575.0" y="638.0">rejection</tspan></text></g>
  <line x1="35" y1="1097" x2="1565" y2="1097" stroke="#e8f0f3"/><text class="details-title" x="35" y="1127">Detailed implementation steps</text><g class="step"><rect x="35" y="1142" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1173" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1178" text-anchor="middle">1</text><text class="step-text"><tspan x="92" y="1159">Candidate review loads ranked intro/outro alternatives, audition media, waveforms,</tspan><tspan x="92" y="1177">cues, and score evidence.</tspan></text></g><g class="step"><rect x="815" y="1142" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1173" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1178" text-anchor="middle">2</text><text class="step-text"><tspan x="872" y="1159">Keep, reject, custom transition, or reprocess actions include stable job and</tspan><tspan x="872" y="1177">candidate identity.</tspan></text></g><g class="step"><rect x="35" y="1218" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1249" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1254" text-anchor="middle">3</text><text class="step-text"><tspan x="92" y="1235">Job review routes validate candidate position/rank and delegate persistence to the</tspan><tspan x="92" y="1253">review workflow owner.</tspan></text></g><g class="step"><rect x="815" y="1218" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1249" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1254" text-anchor="middle">4</text><text class="step-text"><tspan x="872" y="1235">TrackFeedbackRequest stores rating and notes separately from authoritative BPM or</tspan><tspan x="872" y="1253">key verification.</tspan></text></g><g class="step"><rect x="35" y="1294" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1325" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1330" text-anchor="middle">5</text><text class="step-text"><tspan x="92" y="1311">KeyVerificationRequest and BpmVerificationRequest update reviewed analysis values</tspan><tspan x="92" y="1329">with provenance.</tspan></text></g><g class="step"><rect x="815" y="1294" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1325" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1330" text-anchor="middle">6</text><text class="step-text"><tspan x="872" y="1311">Set Builder feedback converts keep, reject, rating, move, replacement, and</tspan><tspan x="872" y="1329">transition edits into preference events.</tspan></text></g><g class="step"><rect x="35" y="1370" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1401" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1406" text-anchor="middle">7</text><text class="step-text"><tspan x="92" y="1387">DJPreferenceService stores local events and builds bounded, context-specific</tspan><tspan x="92" y="1405">preference profiles.</tspan></text></g><g class="step"><rect x="815" y="1370" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1401" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1406" text-anchor="middle">8</text><text class="step-text"><tspan x="872" y="1387">SetReviewRequest records intention fulfillment, cohesion, transitions, pacing,</tspan><tspan x="872" y="1405">acceptance delta, and notes.</tspan></text></g><g class="step"><rect x="35" y="1446" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1477" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1482" text-anchor="middle">9</text><text class="step-text"><tspan x="92" y="1463">SetReviewService persists the review and refreshes calibration summaries without</tspan><tspan x="92" y="1481">rewriting historical plans.</tspan></text></g><g class="step"><rect x="815" y="1446" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1477" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1482" text-anchor="middle">10</text><text class="step-text"><tspan x="872" y="1463">Reporting routes rebuild analytics, processing reports, audio indexes, and</tspan><tspan x="872" y="1481">detailed job evidence as projections.</tspan></text></g><g class="step"><rect x="35" y="1522" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1553" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1558" text-anchor="middle">11</text><text class="step-text"><tspan x="92" y="1539">The UI shows an explicit saved or rejected receipt so a click never leaves</tspan><tspan x="92" y="1557">feedback durability ambiguous.</tspan></text></g>
</svg>
