<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2045"
  viewBox="0 0 1600 2045" role="img" aria-labelledby="title desc">
  <title id="title">Set Builder</title>
  <desc id="desc">A brief becomes a validated journey, a recording-safe plan, editable transitions, and a saved export.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167ba3"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85852"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #52666e; }
      .lane-label {
        font: 700 14px system-ui, -apple-system, sans-serif;
        letter-spacing: 1.3px;
        fill: #52666e;
        text-transform: uppercase;
      }
      .node-label { font: 700 15px system-ui, -apple-system, sans-serif; }
      .edge-label {
        font: 700 11px system-ui, -apple-system, sans-serif;
        fill: #132f3a;
        letter-spacing: .4px;
      }
      .details-title { font: 700 19px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .step-number { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .step-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #132f3a; }
    </style>
  </defs>
  <rect width="1600" height="2045" fill="#ffffff"/>
  <text class="title" x="35" y="43">Set Builder</text>
  <text class="subtitle" x="35" y="72">A brief becomes a validated journey, a recording-safe plan, editable transitions, and a saved export.</text>
  <line x1="35" y1="94" x2="1565" y2="94" stroke="#e8f0f3"/>
  <rect x="35.0" y="135" width="340" height="1248" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="405.0" y="135" width="340" height="1248" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="775.0" y="135" width="340" height="1248" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="1145.0" y="135" width="340" height="1248" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/>
  <text class="lane-label" x="205" y="122" text-anchor="middle">User &amp; browser</text><text class="lane-label" x="575" y="122" text-anchor="middle">HTTP boundary</text><text class="lane-label" x="945" y="122" text-anchor="middle">Services &amp; policy</text><text class="lane-label" x="1315" y="122" text-anchor="middle">Durable state</text>
  <g><path d="M 344.0 178.0 H 390.0 V 178.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 436.0 178.0 H 374.5 V 402.0 H 313.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 313.0 402.0 H 559.5 V 402.0 H 806.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="507.5" y="382.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="559.5" y="398.0" text-anchor="middle">YES</text></g><g><path d="M 205.0 350.0 H 235.0 V 213.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="153.0" y="261.5" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="205.0" y="277.5" text-anchor="middle">EDIT</text></g><g><path d="M 945.0 437.0 H 975.0 V 591.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 945.0 661.0 H 975.0 V 798.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 837.0 850.0 H 590.5 V 850.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="538.5" y="830.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="590.5" y="846.0" text-anchor="middle">YES</text></g><g><path d="M 837.0 850.0 H 775.5 V 738.0 H 714.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="723.5" y="774.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="775.5" y="790.0" text-anchor="middle">NO</text></g><g><path d="M 436.0 738.0 H 390.0 V 850.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="338.0" y="774.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="390.0" y="790.0" text-anchor="middle">safe draft</text></g><g><path d="M 205.0 885.0 H 235.0 V 1039.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 344.0 1074.0 H 575.0 V 1074.0 H 806.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="523.0" y="1054.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="575.0" y="1070.0" text-anchor="middle">rerun</text></g><g><path d="M 945.0 1039.0 H 975.0 V 902.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 344.0 1074.0 H 390.0 V 1298.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="338.0" y="1166.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="390.0" y="1182.0" text-anchor="middle">approve</text></g><g><path d="M 714.0 1298.0 H 945.0 V 1298.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g>
  <g id="brief"><title>Describe or manually shape set</title><rect x="66.0" y="143.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="169.0">Describe or manually shape</tspan><tspan x="205.0" y="190.0">set</tspan></text></g><g id="interpret"><title>Interpret intention and journey</title><rect x="436.0" y="143.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="169.0">Interpret intention and</tspan><tspan x="575.0" y="190.0">journey</tspan></text></g><g id="review"><title>Direction acceptable?</title><polygon points="205,344 321,402 205,460 89,402" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="403.0">Direction acceptable?</tspan></text></g><g id="candidates"><title>Retrieve validated candidates</title><rect x="806.0" y="367.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="393.0">Retrieve validated</tspan><tspan x="945.0" y="414.0">candidates</tspan></text></g><g id="plan"><title>Plan and optimize order</title><rect x="806.0" y="591.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="627.0">Plan and optimize order</tspan></text></g><g id="valid"><title>Health and uniqueness valid?</title><polygon points="945,792 1061,850 945,908 829,850" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="851.0">Health and uniqueness valid?</tspan></text></g><g id="workspace"><title>Review plan workspace</title><rect x="66.0" y="815.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="851.0">Review plan workspace</tspan></text></g><g id="edit"><title>Lock, reject, replace, or reorder</title><rect x="66.0" y="1039.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="1065.0">Lock, reject, replace, or</tspan><tspan x="205.0" y="1086.0">reorder</tspan></text></g><g id="regenerate"><title>Regenerate around locked tracks</title><rect x="806.0" y="1039.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="1065.0">Regenerate around locked</tspan><tspan x="945.0" y="1086.0">tracks</tspan></text></g><g id="save"><title>Save plan and export</title><rect x="436.0" y="1263.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="1299.0">Save plan and export</tspan></text></g><g id="state"><title>Saved sets / planning state</title><rect x="1176.0" y="1263.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="1299.0">Saved sets / planning state</tspan></text></g><g id="fallback"><title>Explain fallback or repair</title><rect x="436.0" y="703.0" width="278" height="70" rx="8" fill="#d85852" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="739.0">Explain fallback or repair</tspan></text></g>
  <line x1="35" y1="1433" x2="1565" y2="1433" stroke="#e8f0f3"/><text class="details-title" x="35" y="1463">Detailed implementation steps</text><g class="step"><rect x="35" y="1478" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1509" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1514" text-anchor="middle">1</text><text class="step-text"><tspan x="92" y="1495">The user selects Describe what I want or Build manually; both paths produce the</tspan><tspan x="92" y="1513">same editable set brief.</tspan></text></g><g class="step"><rect x="815" y="1478" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1509" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1514" text-anchor="middle">2</text><text class="step-text"><tspan x="872" y="1495">POST /interpret-intention converts natural language into requirements,</tspan><tspan x="872" y="1513">preferences, limits, and identity terms.</tspan></text></g><g class="step"><rect x="35" y="1554" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1585" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1590" text-anchor="middle">3</text><text class="step-text"><tspan x="92" y="1571">POST /plan-journey proposes editable sections with duration, energy, genres,</tspan><tspan x="92" y="1589">character, and purpose.</tspan></text></g><g class="step"><rect x="815" y="1554" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1585" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1590" text-anchor="middle">4</text><text class="step-text"><tspan x="872" y="1571">The user reviews and edits the interpretation and journey before any track-</tspan><tspan x="872" y="1589">selection request is created.</tspan></text></g><g class="step"><rect x="35" y="1630" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1661" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1666" text-anchor="middle">5</text><text class="step-text"><tspan x="92" y="1647">planning-request.js derives target count, section allocation, required/excluded</tspan><tspan x="92" y="1665">tracks, locks, and base revision.</tspan></text></g><g class="step"><rect x="815" y="1630" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1661" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1666" text-anchor="middle">6</text><text class="step-text"><tspan x="872" y="1647">Candidate retrieval applies availability, analysis, genre, BPM, key, vocal,</tspan><tspan x="872" y="1665">timing, and recording-family rules.</tspan></text></g><g class="step"><rect x="35" y="1706" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1737" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1742" text-anchor="middle">7</text><text class="step-text"><tspan x="92" y="1723">The candidate pool exposes relevance tiers and reasons while excluding unsafe or</tspan><tspan x="92" y="1741">duplicate recording identities.</tspan></text></g><g class="step"><rect x="815" y="1706" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1737" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1742" text-anchor="middle">8</text><text class="step-text"><tspan x="872" y="1723">AI-assisted planning receives only validated candidates; deterministic planning</tspan><tspan x="872" y="1741">uses the same pool and rules.</tspan></text></g><g class="step"><rect x="35" y="1782" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1813" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1818" text-anchor="middle">9</text><text class="step-text"><tspan x="92" y="1799">The asynchronous planning client polls the durable job record until completed,</tspan><tspan x="92" y="1817">failed, or canceled.</tspan></text></g><g class="step"><rect x="815" y="1782" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1813" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1818" text-anchor="middle">10</text><text class="step-text"><tspan x="872" y="1799">SetPlanValidator checks requested rules, recording uniqueness, duration, section</tspan><tspan x="872" y="1817">allocation, and track availability.</tspan></text></g><g class="step"><rect x="35" y="1858" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1889" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1894" text-anchor="middle">11</text><text class="step-text"><tspan x="92" y="1875">The workspace renders health, intention fulfillment, transitions, receipt</tspan><tspan x="92" y="1893">provenance, and recording alternatives.</tspan></text></g><g class="step"><rect x="815" y="1858" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1889" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1894" text-anchor="middle">12</text><text class="step-text"><tspan x="872" y="1875">Edits create undo/redo checkpoints; rejection, replacement, reordering, and</tspan><tspan x="872" y="1893">transition changes update the draft.</tspan></text></g><g class="step"><rect x="35" y="1934" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1965" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1970" text-anchor="middle">13</text><text class="step-text"><tspan x="92" y="1951">Regeneration sends locked_track_sections and base_plan_revision, then compares</tspan><tspan x="92" y="1969">stayed, added, and removed tracks.</tspan></text></g><g class="step"><rect x="815" y="1934" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1965" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1970" text-anchor="middle">14</text><text class="step-text"><tspan x="872" y="1951">SavedSetService stores the versioned plan; exports derive CSV, M3U8, cue, or</tspan><tspan x="872" y="1969">Rekordbox output from that revision.</tspan></text></g>
</svg>
