<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1745"
  viewBox="0 0 1600 1745" role="img" aria-labelledby="title desc">
  <title id="title">Import workflows</title>
  <desc id="desc">Local audio, playlist matches, authorized URLs, and Creative Commons converge on catalog publication.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167ba3"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85852"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #52666e; }
      .lane-label {
        font: 700 14px system-ui, -apple-system, sans-serif;
        letter-spacing: 1.3px;
        fill: #52666e;
        text-transform: uppercase;
      }
      .node-label { font: 700 15px system-ui, -apple-system, sans-serif; }
      .edge-label {
        font: 700 11px system-ui, -apple-system, sans-serif;
        fill: #132f3a;
        letter-spacing: .4px;
      }
      .details-title { font: 700 19px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .step-number { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .step-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #132f3a; }
    </style>
  </defs>
  <rect width="1600" height="1745" fill="#ffffff"/>
  <text class="title" x="35" y="43">Import workflows</text>
  <text class="subtitle" x="35" y="72">Local audio, playlist matches, authorized URLs, and Creative Commons converge on catalog publication.</text>
  <line x1="35" y1="94" x2="1565" y2="94" stroke="#e8f0f3"/>
  <rect x="35.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="405.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="775.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="1145.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/>
  <text class="lane-label" x="205" y="122" text-anchor="middle">User &amp; browser</text><text class="lane-label" x="575" y="122" text-anchor="middle">HTTP boundary</text><text class="lane-label" x="945" y="122" text-anchor="middle">Services &amp; policy</text><text class="lane-label" x="1315" y="122" text-anchor="middle">Durable state</text>
  <g><path d="M 205.0 213.0 H 235.0 V 350.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 313.0 402.0 H 374.5 V 402.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="322.5" y="382.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="374.5" y="398.0" text-anchor="middle">selected path</text></g><g><path d="M 714.0 402.0 H 775.5 V 402.0 H 837.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 945.0 454.0 H 975.0 V 591.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="893.0" y="502.5" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="945.0" y="518.5" text-anchor="middle">VALID</text></g><g><path d="M 837.0 402.0 H 775.5 V 626.0 H 714.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="723.5" y="494.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="775.5" y="510.0" text-anchor="middle">REJECT</text></g><g><path d="M 945.0 661.0 H 975.0 V 815.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 806.0 626.0 H 760.0 V 626.0 H 714.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="708.0" y="606.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="760.0" y="622.0" text-anchor="middle">NOT FOUND</text></g><g><path d="M 1084.0 850.0 H 1130.0 V 850.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1315.0 885.0 H 1345.0 V 1039.0 H 1315.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 1074.0 H 760.0 V 1074.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 575.0 591.0 H 605.0 V 437.0 H 575.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="523.0" y="494.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="575.0" y="510.0" text-anchor="middle">retry / choose match</text></g>
  <g id="source"><title>Choose import source</title><rect x="66.0" y="143.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="179.0">Choose import source</tspan></text></g><g id="kind"><title>Local, playlist, URL, or CC?</title><polygon points="205,344 321,402 205,460 89,402" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="403.0">Local, playlist, URL, or CC?</tspan></text></g><g id="upload"><title>Upload or submit source</title><rect x="436.0" y="367.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="403.0">Upload or submit source</tspan></text></g><g id="validate"><title>Validate format and authority</title><polygon points="945,344 1061,402 945,460 829,402" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="393.0">Validate format and</tspan><tspan x="945.0" y="414.0">authority</tspan></text></g><g id="resolve"><title>Resolve or download audio</title><rect x="806.0" y="591.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="627.0">Resolve or download audio</tspan></text></g><g id="convert"><title>Convert and inspect WAV</title><rect x="806.0" y="815.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="851.0">Convert and inspect WAV</tspan></text></g><g id="catalog"><title>Upsert catalog identity</title><rect x="1176.0" y="815.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="851.0">Upsert catalog identity</tspan></text></g><g id="publish"><title>Publish catalog projections</title><rect x="1176.0" y="1039.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="1075.0">Publish catalog projections</tspan></text></g><g id="done"><title>Show imported tracks</title><rect x="66.0" y="1039.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="1075.0">Show imported tracks</tspan></text></g><g id="failure"><title>Record actionable failure</title><rect x="436.0" y="591.0" width="278" height="70" rx="8" fill="#d85852" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="627.0">Record actionable failure</tspan></text></g>
  <line x1="35" y1="1209" x2="1565" y2="1209" stroke="#e8f0f3"/><text class="details-title" x="35" y="1239">Detailed implementation steps</text><g class="step"><rect x="35" y="1254" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1285" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1290" text-anchor="middle">1</text><text class="step-text"><tspan x="92" y="1271">The Import workspace classifies local files, playlist CSVs, authorized URLs, or</tspan><tspan x="92" y="1289">Creative Commons sources.</tspan></text></g><g class="step"><rect x="815" y="1254" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1285" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1290" text-anchor="middle">2</text><text class="step-text"><tspan x="872" y="1271">LocalAudioImportService validates extensions, stages uploads, converts audio, and</tspan><tspan x="872" y="1289">records batch lifecycle.</tspan></text></g><g class="step"><rect x="35" y="1330" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1361" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1366" text-anchor="middle">3</text><text class="step-text"><tspan x="92" y="1347">PlaylistMatchService parses rows, normalizes metadata, and proposes local or</tspan><tspan x="92" y="1365">authorized source matches.</tspan></text></g><g class="step"><rect x="815" y="1330" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1361" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1366" text-anchor="middle">4</text><text class="step-text"><tspan x="872" y="1347">SourceMatchingService.match() inspects a bounded URL and returns provider metadata</tspan><tspan x="872" y="1365">before import starts.</tspan></text></g><g class="step"><rect x="35" y="1406" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1437" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1442" text-anchor="middle">5</text><text class="step-text"><tspan x="92" y="1423">ImportService.start() validates youtube or soundcloud authority and creates a</tspan><tspan x="92" y="1441">durable operation identifier.</tspan></text></g><g class="step"><rect x="815" y="1406" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1437" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1442" text-anchor="middle">6</text><text class="step-text"><tspan x="872" y="1423">CreativeCommonsImportService.start() validates reviewed matches and delegates work</tspan><tspan x="872" y="1441">to its batch worker.</tspan></text></g><g class="step"><rect x="35" y="1482" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1513" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1518" text-anchor="middle">7</text><text class="step-text"><tspan x="92" y="1499">BackgroundTaskRegistry persists pending, running, canceled, failed, or completed</tspan><tspan x="92" y="1517">progress across restarts.</tspan></text></g><g class="step"><rect x="815" y="1482" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1513" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1518" text-anchor="middle">8</text><text class="step-text"><tspan x="872" y="1499">The browser polls the family-specific status endpoint and renders stages, counts,</tspan><tspan x="872" y="1517">and recovery actions.</tspan></text></g><g class="step"><rect x="35" y="1558" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1589" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1594" text-anchor="middle">9</text><text class="step-text"><tspan x="92" y="1575">Downloaded audio is converted to managed WAV and inspected before it enters the</tspan><tspan x="92" y="1593">catalog.</tspan></text></g><g class="step"><rect x="815" y="1558" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1589" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1594" text-anchor="middle">10</text><text class="step-text"><tspan x="872" y="1575">Repository upsert combines normalized metadata, audio fingerprint evidence,</tspan><tspan x="872" y="1593">playlist, and file paths.</tspan></text></g><g class="step"><rect x="35" y="1634" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1665" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1670" text-anchor="middle">11</text><text class="step-text"><tspan x="92" y="1651">CatalogProjectionPublisher refreshes Music Files, DJ Library, and Set Builder read</tspan><tspan x="92" y="1669">models.</tspan></text></g><g class="step"><rect x="815" y="1634" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1665" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1670" text-anchor="middle">12</text><text class="step-text"><tspan x="872" y="1651">Actionable failures remain available through ImportIssueService for retry,</tspan><tspan x="872" y="1669">correction, or deletion.</tspan></text></g>
</svg>
