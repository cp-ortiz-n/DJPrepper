<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1669"
  viewBox="0 0 1600 1669" role="img" aria-labelledby="title desc">
  <title id="title">DJ Library</title>
  <desc id="desc">A current search projection becomes performance-ready browsing, compatibility, and selection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167ba3"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85852"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #52666e; }
      .lane-label {
        font: 700 14px system-ui, -apple-system, sans-serif;
        letter-spacing: 1.3px;
        fill: #52666e;
        text-transform: uppercase;
      }
      .node-label { font: 700 15px system-ui, -apple-system, sans-serif; }
      .edge-label {
        font: 700 11px system-ui, -apple-system, sans-serif;
        fill: #132f3a;
        letter-spacing: .4px;
      }
      .details-title { font: 700 19px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .step-number { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .step-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #132f3a; }
    </style>
  </defs>
  <rect width="1600" height="1669" fill="#ffffff"/>
  <text class="title" x="35" y="43">DJ Library</text>
  <text class="subtitle" x="35" y="72">A current search projection becomes performance-ready browsing, compatibility, and selection.</text>
  <line x1="35" y1="94" x2="1565" y2="94" stroke="#e8f0f3"/>
  <rect x="35.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="405.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="775.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="1145.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/>
  <text class="lane-label" x="205" y="122" text-anchor="middle">User &amp; browser</text><text class="lane-label" x="575" y="122" text-anchor="middle">HTTP boundary</text><text class="lane-label" x="945" y="122" text-anchor="middle">Services &amp; policy</text><text class="lane-label" x="1315" y="122" text-anchor="middle">Durable state</text>
  <g><path d="M 205.0 213.0 H 235.0 V 367.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 344.0 402.0 H 390.0 V 402.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 714.0 402.0 H 775.5 V 402.0 H 837.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1053.0 402.0 H 1114.5 V 626.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1062.5" y="494.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="1114.5" y="510.0" text-anchor="middle">YES</text></g><g><path d="M 945.0 454.0 H 975.0 V 591.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="893.0" y="502.5" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="945.0" y="518.5" text-anchor="middle">NO</text></g><g><path d="M 1084.0 626.0 H 1130.0 V 626.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 626.0 H 1130.0 V 850.0 H 1084.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 806.0 850.0 H 559.5 V 850.0 H 313.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 205.0 902.0 H 235.0 V 1039.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="153.0" y="950.5" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="205.0" y="966.5" text-anchor="middle">YES</text></g><g><path d="M 313.0 850.0 H 374.5 V 850.0 H 436.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="322.5" y="830.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="374.5" y="846.0" text-anchor="middle">NO</text></g><g><path d="M 575.0 815.0 H 390.0 V 437.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="338.0" y="606.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="390.0" y="622.0" text-anchor="middle">latest generation</text></g>
  <g id="open"><title>Open or filter DJ Library</title><rect x="66.0" y="143.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="179.0">Open or filter DJ Library</tspan></text></g><g id="state"><title>Update request state</title><rect x="66.0" y="367.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="403.0">Update request state</tspan></text></g><g id="query"><title>GET /api/library/catalog</title><rect x="436.0" y="367.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="403.0">GET /api/library/catalog</tspan></text></g><g id="current"><title>Projection current?</title><polygon points="945,344 1061,402 945,460 829,402" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="403.0">Projection current?</tspan></text></g><g id="rebuild"><title>Rebuild search projection</title><rect x="806.0" y="591.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="627.0">Rebuild search projection</tspan></text></g><g id="page"><title>Page tracks and facets</title><rect x="1176.0" y="591.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="627.0">Page tracks and facets</tspan></text></g><g id="profile"><title>Attach musical profile</title><rect x="806.0" y="815.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="851.0">Attach musical profile</tspan></text></g><g id="stale"><title>Response still current?</title><polygon points="205,792 321,850 205,908 89,850" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="851.0">Response still current?</tspan></text></g><g id="render"><title>Render library intelligence</title><rect x="66.0" y="1039.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="1075.0">Render library intelligence</tspan></text></g><g id="discard"><title>Discard superseded response</title><rect x="436.0" y="815.0" width="278" height="70" rx="8" fill="#d85852" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="851.0">Discard superseded response</tspan></text></g>
  <line x1="35" y1="1209" x2="1565" y2="1209" stroke="#e8f0f3"/><text class="details-title" x="35" y="1239">Detailed implementation steps</text><g class="step"><rect x="35" y="1254" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1285" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1290" text-anchor="middle">1</text><text class="step-text"><tspan x="92" y="1271">createDjLibraryFeature() composes query state, filters, rendering, intelligence,</tspan><tspan x="92" y="1289">and selected-track actions.</tspan></text></g><g class="step"><rect x="815" y="1254" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1285" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1290" text-anchor="middle">2</text><text class="step-text"><tspan x="872" y="1271">A filter, search, sort, or page change advances the request generation and aborts</tspan><tspan x="872" y="1289">an older fetch.</tspan></text></g><g class="step"><rect x="35" y="1330" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1361" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1366" text-anchor="middle">3</text><text class="step-text"><tspan x="92" y="1347">GET /api/library/catalog compares projection source signatures before deciding</tspan><tspan x="92" y="1365">whether to rebuild.</tspan></text></g><g class="step"><rect x="815" y="1330" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1361" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1366" text-anchor="middle">4</text><text class="step-text"><tspan x="872" y="1347">CatalogProjectionBuilder combines completed job evidence with downloaded-track</tspan><tspan x="872" y="1365">catalog identity.</tspan></text></g><g class="step"><rect x="35" y="1406" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1437" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1442" text-anchor="middle">5</text><text class="step-text"><tspan x="92" y="1423">replace_library_search_index() persists the derived DJ Library search projection</tspan><tspan x="92" y="1441">when sources changed.</tspan></text></g><g class="step"><rect x="815" y="1406" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1437" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1442" text-anchor="middle">6</text><text class="step-text"><tspan x="872" y="1423">page_library_tracks() returns one result page and filter facets without loading</tspan><tspan x="872" y="1441">the full library.</tspan></text></g><g class="step"><rect x="35" y="1482" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1513" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1518" text-anchor="middle">7</text><text class="step-text"><tspan x="92" y="1499">musical_profile() supplies authoritative key, Camelot, energy, role, vocals,</tspan><tspan x="92" y="1517">timing, confidence, and provenance.</tspan></text></g><g class="step"><rect x="815" y="1482" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1513" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1518" text-anchor="middle">8</text><text class="step-text"><tspan x="872" y="1499">The request controller discards a response when a newer browser generation already</tspan><tspan x="872" y="1517">exists.</tspan></text></g><g class="step"><rect x="35" y="1558" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1589" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1594" text-anchor="middle">9</text><text class="step-text"><tspan x="92" y="1575">createDjLibraryView() groups and renders tracks while intelligence.js explains</tspan><tspan x="92" y="1593">compatibility and recommendations.</tspan></text></g><g class="step"><rect x="815" y="1558" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1589" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1594" text-anchor="middle">10</text><text class="step-text"><tspan x="872" y="1575">Selection actions reveal or play media, then hand chosen tracks to processing</tspan><tspan x="872" y="1593">without duplicating mutation policy.</tspan></text></g>
</svg>
