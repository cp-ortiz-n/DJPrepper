<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700"
  viewBox="0 0 1440 700" role="img" aria-labelledby="title desc">
  <title id="title">DJPrepper workflow map</title>
  <desc id="desc">The common call path from a user action to durable state and a visible result. Calls are numbered in execution order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1680a6"/>
    </marker>
    <style>
      .title { font: 750 30px system-ui, -apple-system, sans-serif; fill: #18323c; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #60747c; }
      .order-note {
        font: 650 12px system-ui, -apple-system, sans-serif;
        fill: #1680a6;
        letter-spacing: .7px;
      }
      .call-number { font: 700 14px system-ui, -apple-system, sans-serif; fill: #1680a6; }
      .owner { font: 700 11px system-ui, -apple-system, sans-serif; fill: #ffffff; letter-spacing: .25px; }
      .call-title { font: 720 17px system-ui, -apple-system, sans-serif; fill: #18323c; }
      .symbol { font: 500 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #60747c; }
      .arrow {
        fill: none;
        stroke: #1680a6;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .alternate-title {
        font: 750 12px system-ui, -apple-system, sans-serif;
        fill: #60747c;
        letter-spacing: 1.3px;
      }
      .alternate-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #18323c; }
    </style>
  </defs>
  <rect width="1440" height="700" fill="#ffffff"/>
  <rect x="28" y="25" width="1384" height="510" rx="24" fill="#f4f8fa"/>
  <text class="title" x="52" y="67">DJPrepper workflow map</text>
  <text class="subtitle" x="52" y="95">The common call path from a user action to durable state and a visible result.</text>
  <text class="order-note" x="52" y="132">PRIMARY CALL ORDER</text>
  <path class="arrow" d="M 352 246.0 H 378" marker-end="url(#arrow)"/><path class="arrow" d="M 686 246.0 H 712" marker-end="url(#arrow)"/><path class="arrow" d="M 1020 246.0 H 1046" marker-end="url(#arrow)"/><path class="arrow" d="M 1354 246.0 H 1371.0 V 443.0 H 1362" marker-end="url(#arrow)"/><path class="arrow" d="M 1054 443.0 H 1028" marker-end="url(#arrow)"/><path class="arrow" d="M 720 443.0 H 694" marker-end="url(#arrow)"/><path class="arrow" d="M 386 443.0 H 360" marker-end="url(#arrow)"/>
  <g class="call" id="call-1">
  <text class="call-number" x="52.0" y="172.0">(1)</text>
  <rect x="52" y="185" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="67" y="199" width="75" height="25" rx="12.5"
    fill="#147f9f"/>
  <text class="owner" x="80" y="216">Browser</text>
  <text class="call-title" text-anchor="middle"><tspan x="202.0" y="239.0">Choose an action</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="202.0" y="276.0">feature event</tspan></text>
</g><g class="call" id="call-2">
  <text class="call-number" x="386.0" y="172.0">(2)</text>
  <rect x="386" y="185" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="401" y="199" width="75" height="25" rx="12.5"
    fill="#147f9f"/>
  <text class="owner" x="414" y="216">Feature</text>
  <text class="call-title" text-anchor="middle"><tspan x="536.0" y="239.0">Build request state</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="536.0" y="276.0">controller / view model</tspan></text>
</g><g class="call" id="call-3">
  <text class="call-number" x="720.0" y="172.0">(3)</text>
  <rect x="720" y="185" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="735" y="199" width="103" height="25" rx="12.5"
    fill="#4b6cb7"/>
  <text class="owner" x="748" y="216">HTTP client</text>
  <text class="call-title" text-anchor="middle"><tspan x="870.0" y="239.0">Send API request</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="870.0" y="276.0">shared api client</tspan></text>
</g><g class="call" id="call-4">
  <text class="call-number" x="1054.0" y="172.0">(4)</text>
  <rect x="1054" y="185" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="1069" y="199" width="68" height="25" rx="12.5"
    fill="#4b6cb7"/>
  <text class="owner" x="1082" y="216">Router</text>
  <text class="call-title" text-anchor="middle"><tspan x="1204.0" y="239.0">Parse the contract</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="1204.0" y="276.0">focused FastAPI route</tspan></text>
</g><g class="call" id="call-5">
  <text class="call-number" x="1054.0" y="369.0">(5)</text>
  <rect x="1054" y="382" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="1069" y="396" width="75" height="25" rx="12.5"
    fill="#258b72"/>
  <text class="owner" x="1082" y="413">Service</text>
  <text class="call-title" text-anchor="middle"><tspan x="1204.0" y="436.0">Run the workflow</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="1204.0" y="473.0">owning application service</tspan></text>
</g><g class="call" id="call-6">
  <text class="call-number" x="720.0" y="369.0">(6)</text>
  <rect x="720" y="382" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="735" y="396" width="117" height="25" rx="12.5"
    fill="#705aa8"/>
  <text class="owner" x="748" y="413">Domain + data</text>
  <text class="call-title" text-anchor="middle"><tspan x="870.0" y="436.0">Apply policy and write</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="870.0" y="473.0">policy + repository</tspan></text>
</g><g class="call" id="call-7">
  <text class="call-number" x="386.0" y="369.0">(7)</text>
  <rect x="386" y="382" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="401" y="396" width="96" height="25" rx="12.5"
    fill="#705aa8"/>
  <text class="owner" x="414" y="413">Projection</text>
  <text class="call-title" text-anchor="middle"><tspan x="536.0" y="436.0">Publish read models</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="536.0" y="473.0">cache invalidation / publish</tspan></text>
</g><g class="call" id="call-8">
  <text class="call-number" x="52.0" y="369.0">(8)</text>
  <rect x="52" y="382" width="300" height="122" rx="16"
    fill="#ffffff" stroke="#d7e4e9" stroke-width="2"/>
  <rect x="67" y="396" width="75" height="25" rx="12.5"
    fill="#147f9f"/>
  <text class="owner" x="80" y="413">Feature</text>
  <text class="call-title" text-anchor="middle"><tspan x="202.0" y="436.0">Render the result</tspan></text>
  <text class="symbol" text-anchor="middle"><tspan x="202.0" y="473.0">receipt / next safe action</tspan></text>
</g>
  <text class="alternate-title" x="52" y="565">ALTERNATE PATHS</text><g class="alternate"><rect x="52" y="583" width="655" height="72" rx="14" fill="#fff8f7" stroke="#eed1cf"/><circle cx="77" cy="619" r="8" fill="#c95955"/><text class="alternate-text"><tspan x="100" y="613">Validation failure → return an actionable error without changing durable</tspan><tspan x="100" y="631">state.</tspan></text></g><g class="alternate"><rect x="733" y="583" width="655" height="72" rx="14" fill="#fff8f7" stroke="#eed1cf"/><circle cx="758" cy="619" r="8" fill="#c95955"/><text class="alternate-text"><tspan x="781" y="613">Long-running work → return an operation ID and poll until a terminal state.</tspan></text></g>
</svg>
