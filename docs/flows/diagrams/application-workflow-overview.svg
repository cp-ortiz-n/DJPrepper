<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1593"
  viewBox="0 0 1600 1593" role="img" aria-labelledby="title desc">
  <title id="title">DJ Library Studio workflow map</title>
  <desc id="desc">The shared path from a user action to validated state, durable results, and visible feedback.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167ba3"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85852"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #52666e; }
      .lane-label {
        font: 700 14px system-ui, -apple-system, sans-serif;
        letter-spacing: 1.3px;
        fill: #52666e;
        text-transform: uppercase;
      }
      .node-label { font: 700 15px system-ui, -apple-system, sans-serif; }
      .edge-label {
        font: 700 11px system-ui, -apple-system, sans-serif;
        fill: #132f3a;
        letter-spacing: .4px;
      }
      .details-title { font: 700 19px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .step-number { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .step-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #132f3a; }
    </style>
  </defs>
  <rect width="1600" height="1593" fill="#ffffff"/>
  <text class="title" x="35" y="43">DJ Library Studio workflow map</text>
  <text class="subtitle" x="35" y="72">The shared path from a user action to validated state, durable results, and visible feedback.</text>
  <line x1="35" y1="94" x2="1565" y2="94" stroke="#e8f0f3"/>
  <rect x="35.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="405.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="775.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="1145.0" y="135" width="340" height="1024" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/>
  <text class="lane-label" x="205" y="122" text-anchor="middle">User &amp; browser</text><text class="lane-label" x="575" y="122" text-anchor="middle">HTTP boundary</text><text class="lane-label" x="945" y="122" text-anchor="middle">Services &amp; policy</text><text class="lane-label" x="1315" y="122" text-anchor="middle">Durable state</text>
  <g><path d="M 205.0 213.0 H 235.0 V 367.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 344.0 402.0 H 390.0 V 402.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 575.0 437.0 H 605.0 V 591.0 H 575.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 714.0 626.0 H 760.0 V 626.0 H 806.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 945.0 591.0 H 975.0 V 454.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 945.0 454.0 H 975.0 V 815.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="893.0" y="614.5" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="945.0" y="630.5" text-anchor="middle">YES</text></g><g><path d="M 837.0 402.0 H 775.5 V 178.0 H 714.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="723.5" y="270.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="775.5" y="286.0" text-anchor="middle">NO</text></g><g><path d="M 1084.0 850.0 H 1130.0 V 850.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1315.0 885.0 H 1345.0 V 1039.0 H 1315.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1176.0 1074.0 H 760.0 V 1074.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="708.0" y="1054.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="760.0" y="1070.0" text-anchor="middle">receipt / projection</text></g><g><path d="M 436.0 178.0 H 390.0 V 402.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="338.0" y="270.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="390.0" y="286.0" text-anchor="middle">retry or revise</text></g>
  <g id="action"><title>Choose a workflow</title><rect x="66.0" y="143.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="179.0">Choose a workflow</tspan></text></g><g id="feature"><title>Feature controller</title><rect x="66.0" y="367.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="403.0">Feature controller</tspan></text></g><g id="request"><title>Create validated request</title><rect x="436.0" y="367.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="403.0">Create validated request</tspan></text></g><g id="route"><title>Focused FastAPI router</title><rect x="436.0" y="591.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="627.0">Focused FastAPI router</tspan></text></g><g id="service"><title>Owning application service</title><rect x="806.0" y="591.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="627.0">Owning application service</tspan></text></g><g id="valid"><title>Command valid and safe?</title><polygon points="945,344 1061,402 945,460 829,402" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="403.0">Command valid and safe?</tspan></text></g><g id="policy"><title>Domain or musical policy</title><rect x="806.0" y="815.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="851.0">Domain or musical policy</tspan></text></g><g id="repo"><title>Narrow persistence capability</title><rect x="1176.0" y="815.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="841.0">Narrow persistence</tspan><tspan x="1315.0" y="862.0">capability</tspan></text></g><g id="store"><title>SQLite / managed files</title><rect x="1176.0" y="1039.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="1075.0">SQLite / managed files</tspan></text></g><g id="result"><title>Render status or result</title><rect x="66.0" y="1039.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="1075.0">Render status or result</tspan></text></g><g id="error"><title>Explain recovery action</title><rect x="436.0" y="143.0" width="278" height="70" rx="8" fill="#d85852" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="179.0">Explain recovery action</tspan></text></g>
  <line x1="35" y1="1209" x2="1565" y2="1209" stroke="#e8f0f3"/><text class="details-title" x="35" y="1239">Detailed implementation steps</text><g class="step"><rect x="35" y="1254" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1285" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1290" text-anchor="middle">1</text><text class="step-text"><tspan x="92" y="1271">The selected frontend feature converts the user action into explicit request</tspan><tspan x="92" y="1289">state.</tspan></text></g><g class="step"><rect x="815" y="1254" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1285" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1290" text-anchor="middle">2</text><text class="step-text"><tspan x="872" y="1280">The shared API client serializes the request and normalizes HTTP errors.</tspan></text></g><g class="step"><rect x="35" y="1330" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1361" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1366" text-anchor="middle">3</text><text class="step-text"><tspan x="92" y="1356">A focused FastAPI router parses the contract and injects the owning service.</tspan></text></g><g class="step"><rect x="815" y="1330" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1361" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1366" text-anchor="middle">4</text><text class="step-text"><tspan x="872" y="1356">The service validates workflow invariants before changing durable state.</tspan></text></g><g class="step"><rect x="35" y="1406" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1437" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1442" text-anchor="middle">5</text><text class="step-text"><tspan x="92" y="1423">Domain policy computes musical, identity, or safety decisions without HTTP</tspan><tspan x="92" y="1441">concerns.</tspan></text></g><g class="step"><rect x="815" y="1406" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1437" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1442" text-anchor="middle">6</text><text class="step-text"><tspan x="872" y="1432">A narrow persistence capability commits SQLite rows or managed-file state.</tspan></text></g><g class="step"><rect x="35" y="1482" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1513" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1518" text-anchor="middle">7</text><text class="step-text"><tspan x="92" y="1508">Projection publishers invalidate caches and rebuild consumer-facing read models.</tspan></text></g><g class="step"><rect x="815" y="1482" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1513" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1518" text-anchor="middle">8</text><text class="step-text"><tspan x="872" y="1499">The browser receives a result or operation receipt and renders the next safe</tspan><tspan x="872" y="1517">action.</tspan></text></g>
</svg>
