<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1857"
  viewBox="0 0 1600 1857" role="img" aria-labelledby="title desc">
  <title id="title">Startup and navigation</title>
  <desc id="desc">One atomic frontend revision is composed with backend services before navigation becomes ready.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#167ba3"/>
    </marker>
    <marker id="arrow-failure" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85852"/>
    </marker>
    <style>
      .title { font: 700 28px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .subtitle { font: 400 15px system-ui, -apple-system, sans-serif; fill: #52666e; }
      .lane-label {
        font: 700 14px system-ui, -apple-system, sans-serif;
        letter-spacing: 1.3px;
        fill: #52666e;
        text-transform: uppercase;
      }
      .node-label { font: 700 15px system-ui, -apple-system, sans-serif; }
      .edge-label {
        font: 700 11px system-ui, -apple-system, sans-serif;
        fill: #132f3a;
        letter-spacing: .4px;
      }
      .details-title { font: 700 19px system-ui, -apple-system, sans-serif; fill: #132f3a; }
      .step-number { font: 700 13px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .step-text { font: 500 13px system-ui, -apple-system, sans-serif; fill: #132f3a; }
    </style>
  </defs>
  <rect width="1600" height="1857" fill="#ffffff"/>
  <text class="title" x="35" y="43">Startup and navigation</text>
  <text class="subtitle" x="35" y="72">One atomic frontend revision is composed with backend services before navigation becomes ready.</text>
  <line x1="35" y1="94" x2="1565" y2="94" stroke="#e8f0f3"/>
  <rect x="35.0" y="135" width="340" height="1136" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="405.0" y="135" width="340" height="1136" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="775.0" y="135" width="340" height="1136" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/><rect x="1145.0" y="135" width="340" height="1136" rx="18" fill="#f7f9fa" stroke="#e8f0f3"/>
  <text class="lane-label" x="205" y="122" text-anchor="middle">User &amp; browser</text><text class="lane-label" x="575" y="122" text-anchor="middle">HTTP boundary</text><text class="lane-label" x="945" y="122" text-anchor="middle">Services &amp; policy</text><text class="lane-label" x="1315" y="122" text-anchor="middle">Durable state</text>
  <g><path d="M 344.0 178.0 H 390.0 V 178.0 H 436.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 714.0 178.0 H 760.0 V 290.0 H 806.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 1084.0 290.0 H 1130.0 V 290.0 H 1176.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 945.0 325.0 H 975.0 V 462.0 H 945.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 837.0 514.0 H 775.5 V 738.0 H 714.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="723.5" y="606.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="775.5" y="622.0" text-anchor="middle">VALID</text></g><g><path d="M 945.0 566.0 H 760.0 V 927.0 H 575.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="708.0" y="726.5" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="760.0" y="742.5" text-anchor="middle">INVALID</text></g><g><path d="M 436.0 738.0 H 390.0 V 738.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 205.0 773.0 H 235.0 V 910.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/></g><g><path d="M 205.0 1014.0 H 235.0 V 1151.0 H 205.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="153.0" y="1062.5" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="205.0" y="1078.5" text-anchor="middle">YES</text></g><g><path d="M 313.0 962.0 H 374.5 V 962.0 H 436.0" fill="none" stroke="#d85852" stroke-width="2.5" marker-end="url(#arrow-failure)"/><rect x="322.5" y="942.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="374.5" y="958.0" text-anchor="middle">NO</text></g><g><path d="M 436.0 962.0 H 390.0 V 738.0 H 344.0" fill="none" stroke="#167ba3" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="338.0" y="830.0" width="104" height="22" rx="11" fill="#ffffff"/><text class="edge-label" x="390.0" y="846.0" text-anchor="middle">reload current revision</text></g>
  <g id="launch"><title>Launch application</title><rect x="66.0" y="143.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="179.0">Launch application</tspan></text></g><g id="factory"><title>create_app() factory</title><rect x="436.0" y="143.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="179.0">create_app() factory</tspan></text></g><g id="runtime"><title>Build runtime and services</title><rect x="806.0" y="255.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="291.0">Build runtime and services</tspan></text></g><g id="recover"><title>Recover interrupted work</title><rect x="1176.0" y="255.0" width="278" height="70" rx="8" fill="#725ca8" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="1315.0" y="291.0">Recover interrupted work</tspan></text></g><g id="manifest"><title>Validate asset manifest</title><polygon points="945,456 1061,514 945,572 829,514" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="945.0" y="515.0">Validate asset manifest</tspan></text></g><g id="shell"><title>Serve revision-safe shell</title><rect x="436.0" y="703.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="739.0">Serve revision-safe shell</tspan></text></g><g id="entry"><title>Load app.js and navigation</title><rect x="66.0" y="703.0" width="278" height="70" rx="8" fill="#277fa7" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="739.0">Load app.js and navigation</tspan></text></g><g id="ready"><title>Navigation ready?</title><polygon points="205,904 321,962 205,1020 89,962" fill="#3dbb8b" stroke="#278c68" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="963.0">Navigation ready?</tspan></text></g><g id="page"><title>Load selected feature</title><rect x="66.0" y="1151.0" width="278" height="70" rx="35" fill="#25afc1" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="205.0" y="1187.0">Load selected feature</tspan></text></g><g id="recovery"><title>Show startup diagnostics</title><rect x="436.0" y="927.0" width="278" height="70" rx="8" fill="#d85852" stroke="#185d78" stroke-width="2"/><text class="node-label" fill="#ffffff" text-anchor="middle"><tspan x="575.0" y="963.0">Show startup diagnostics</tspan></text></g>
  <line x1="35" y1="1321" x2="1565" y2="1321" stroke="#e8f0f3"/><text class="details-title" x="35" y="1351">Detailed implementation steps</text><g class="step"><rect x="35" y="1366" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1397" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1402" text-anchor="middle">1</text><text class="step-text"><tspan x="92" y="1383">The launcher starts Uvicorn with audioextender.web:create_app as an application</tspan><tspan x="92" y="1401">factory.</tspan></text></g><g class="step"><rect x="815" y="1366" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1397" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1402" text-anchor="middle">2</text><text class="step-text"><tspan x="872" y="1383">ApplicationPaths.from_project() resolves workspace, database, reports, backups,</tspan><tspan x="872" y="1401">and frontend roots.</tspan></text></g><g class="step"><rect x="35" y="1442" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1473" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1478" text-anchor="middle">3</text><text class="step-text"><tspan x="92" y="1459">ApplicationRuntime.create() constructs JobRepository, workers, registries, and</tspan><tspan x="92" y="1477">process-local caches.</tspan></text></g><g class="step"><rect x="815" y="1442" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1473" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1478" text-anchor="middle">4</text><text class="step-text"><tspan x="872" y="1459">create_app() installs structured error handlers, middleware, static mounts, and</tspan><tspan x="872" y="1477">startup hooks.</tspan></text></g><g class="step"><rect x="35" y="1518" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1549" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1554" text-anchor="middle">5</text><text class="step-text"><tspan x="92" y="1535">Import, library, Set Builder, reporting, and settings collaborators are built by</tspan><tspan x="92" y="1553">owner-specific builders.</tspan></text></g><g class="step"><rect x="815" y="1518" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1549" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1554" text-anchor="middle">6</text><text class="step-text"><tspan x="872" y="1535">_register_routers() attaches every focused router without moving business rules</tspan><tspan x="872" y="1553">into application.py.</tspan></text></g><g class="step"><rect x="35" y="1594" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1625" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1630" text-anchor="middle">7</text><text class="step-text"><tspan x="92" y="1611">Startup recovery marks interrupted jobs and background operations retryable</tspan><tspan x="92" y="1629">instead of still running.</tspan></text></g><g class="step"><rect x="815" y="1594" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1625" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1630" text-anchor="middle">8</text><text class="step-text"><tspan x="872" y="1611">FrontendAssetService validates one manifest revision, entrypoint, stylesheet, and</tspan><tspan x="872" y="1629">recursive module graph.</tspan></text></g><g class="step"><rect x="35" y="1670" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1701" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1706" text-anchor="middle">9</text><text class="step-text"><tspan x="92" y="1687">The server renders index.html with revisioned asset URLs and bootstrap</tspan><tspan x="92" y="1705">diagnostics.</tspan></text></g><g class="step"><rect x="815" y="1670" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1701" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1706" text-anchor="middle">10</text><text class="step-text"><tspan x="872" y="1687">frontend/app.js creates shared API, DOM, notification, descriptor, and playback</tspan><tspan x="872" y="1705">services.</tspan></text></g><g class="step"><rect x="35" y="1746" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="62" cy="1777" r="17" fill="#277fa7"/><text class="step-number" x="62" y="1782" text-anchor="middle">11</text><text class="step-text"><tspan x="92" y="1772">createNavigationController() binds tabs and calls the selected feature loader.</tspan></text></g><g class="step"><rect x="815" y="1746" width="750" height="62" rx="10" fill="#f7f9fa" stroke="#e8f0f3"/><circle cx="842" cy="1777" r="17" fill="#277fa7"/><text class="step-number" x="842" y="1782" text-anchor="middle">12</text><text class="step-text"><tspan x="872" y="1763">Navigation readiness hides recovery UI; a module failure preserves diagnostics and</tspan><tspan x="872" y="1781">reload controls.</tspan></text></g>
</svg>
